# Пресет пинов VOSTOK: Mellow FLY-C8 (MCU STM32F407, 8 слотов драйверов; хост - отдельный модуль на плате).
# Источник: Mellow-3D/klipper-docs (docs/board/fly_C8/cfg.md): DRIVER0..6, нагреватель и термистор экструдера, стол, вентиляторы, зонд;
# лист pinout из pinouts/Mellow/FLY-C8: слот DRIVER7 (первый слева), нагреватели HE1/HE2, термистор T1, порядок концевиков.
# Плата не проверена на железе. Роли по порядку DRIVER0..6 (на листе они идут справа налево, DRIVER7 - самый левый слот, свободен):
# DRIVER0..4 = X, W, Y левый, Y правый, Z; DRIVER5/DRIVER6 = экструдеры T0/T1 (без плат голов).
# CS (SPI) и UART драйвера - один и тот же пин слота. SPI драйверов - программный на пинах spi3 (PB3/PB5/PB4, из `spi_bus: spi3` в cfg Mellow).
# Концевики (разъёмы DIAG слотов): Y левый/правый = DRIVER0/DRIVER1 (PD9/PD8), X/W (без голов) = DRIVER2/DRIVER3 (PD11/PD10).
# Пины, прочитанные только с картинки (не из cfg): слот DRIVER7 (не используется), нагреватель HE1 (PD13) и термистор T1 (PC3) правой головы:
# сверьте их со своей платой. Питание зонда PE6 и вход PC0 - как в закомментированном BLTouch cfg Mellow.
# Знаки dir_pin и полярность концевиков - как в cfg Mellow (там для X, Y, Z, Z1..Z3, экструдера): проверьте направление моторов и срабатывание после первого запуска.
@@TABLE@@
# Мотор оси X                       | DRIVER0           |
# Мотор оси W                       | DRIVER1           |
# Левый мотор оси Y                 | DRIVER2           |
# Правый мотор оси Y                | DRIVER3           |
# Мотор оси Z                       | DRIVER4           |
H|# Мотор фидера левой головы         | DRIVER5           |
H|# Мотор фидера правой головы        | DRIVER6           |
H|# Нагреватель левой головы          | HE0 (PD14)        |
H|# Нагреватель правой головы         | HE1 (PD13)        |
# Нагреватель стола                 | BED OUT (PB0)     |
H|# Термистор левой головы            | T_E0 (PC2)        |
H|# Термистор правой головы           | T_E1 (PC3)        |
# Термистор стола                   | BED (PC5)         |
H|# Охлаждение хотэнда левой головы   | FAN1              |
H|# Охлаждение хотэнда правой головы  | FAN2              |
# Охлаждение модели                 | FAN0              |
# Охлаждение отсека электроники     | FAN3              |
# Концевик оси Y левый              | DIAG0 (PD9)       |
# Концевик оси Y правый             | DIAG1 (PD8)       |
H|# Концевик оси X                    | DIAG2 (PD11)      |
H|# Концевик оси W                    | DIAG3 (PD10)      |
H|# Датчик автоуровня                 | PC0 (BLTouch)     |
# Подсветка отсека печати           | FAN4              |

@@BASE@@
[carriage ylc]
endstop_pin: PD9

[extra_carriage yrc]
endstop_pin: PD8

[heater_bed]
heater_pin: PB0
sensor_pin: PC5

[fan]
pin: PA0

[controller_fan electronics_fan]
pin: PC6

[led print_chamber_led]
white_pin: PC7
initial_WHITE: 1.0

@@MOTORS@@
[stepper motor_x]
step_pin: PE5
dir_pin: PA8
enable_pin: !PA15

[socket motor_x]
pin: PC9

[stepper motor_w]
step_pin: PE4
dir_pin: PC11
enable_pin: !PC12

[socket motor_w]
pin: PC10

[stepper motor_yl]
step_pin: PE3
dir_pin: !PD1
enable_pin: !PD2

[socket motor_yl]
pin: PD0

[stepper motor_yr]
step_pin: PE2
dir_pin: PD4
enable_pin: !PD5

[socket motor_yr]
pin: PD3

[stepper motor_z]
step_pin: PE1
dir_pin: !PD7
enable_pin: !PB6

[socket motor_z]
pin: PD6

[spi]
spi_software_sclk_pin: PB3
spi_software_mosi_pin: PB5
spi_software_miso_pin: PB4

@@EXTRUDERS@@
[extruder]
step_pin: PE0
dir_pin: PC13
enable_pin: !PC14

[socket extruder]
pin: PB7

[extruder1]
step_pin: PE7
dir_pin: PE11
enable_pin: !PE10

[socket extruder1]
pin: PC15

@@HEADS@@
[extruder]
heater_pin: PD14
sensor_pin: PC2

[extruder1]
heater_pin: PD13
sensor_pin: PC3

[heater_fan e0_fan]
pin: PA1

[heater_fan e1_fan]
pin: PA2

[carriage xc]
endstop_pin: PD11

[dual_carriage wc]
endstop_pin: PD10

[probe]
pin: ^!PC0

[output_pin probe_enable]
pin: PE6
