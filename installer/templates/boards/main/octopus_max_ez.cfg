# Пресет пинов VOSTOK: BTT Octopus Max EZ v1.0 (STM32H723, 10 слотов драйверов EZ).
# Источник: Octopus-Max-EZ/Firmware/Klipper/generic-bigtreetech-octopus-max-ez.cfg (Motor-1,2,3,5, нагреватели, термисторы,
# вентиляторы, CS/UART драйверов) и лист pinout из pinouts/BTT/Octopus_Max_EZ (STEP/DIR/EN слотов Motor-4 и далее, концевики).
# Плата не проверена на железе. Роли по порядку слотов (решение пользователя):
# Motor1..5 = X, W, Y левый, Y правый, Z; Motor6/Motor7 = экструдеры T0/T1 (без плат голов).
# CS (SPI) и UART драйвера - один и тот же пин слота. SPI драйверов - программный на пинах SPI4 (PE12/PE14/PE13).
# Концевики: Y левый/правый = MIN1/MIN2, X/W (без голов) = MIN3/MIN4.
# Пины ПРОЧИТАНЫ С КАРТИНКИ (слоты Motor-4, 6, 7, концевики MIN1..4 и вентиляторы FAN1..FAN3): ОБЯЗАТЕЛЬНО сверьте их со своей платой и схемой.
# Питания зонда ([output_pin probe_enable]) на листе нет: пин остаётся ЗАПОЛНИТЕ.
# Знаки dir_pin как в cfg BTT (там без инверсии): проверьте направление моторов после первого запуска.
@@TABLE@@
# Мотор оси X                       | Motor1            |
# Мотор оси W                       | Motor2            |
# Левый мотор оси Y                 | Motor3            |
# Правый мотор оси Y                | Motor4            |
# Мотор оси Z                       | Motor5            |
H|# Мотор фидера левой головы         | Motor6            |
H|# Мотор фидера правой головы        | Motor7            |
H|# Нагреватель левой головы          | HE0               |
H|# Нагреватель правой головы         | HE1               |
# Нагреватель стола                 | BED-OUT           |
H|# Термистор левой головы            | TH0               |
H|# Термистор правой головы           | TH1               |
# Термистор стола                   | THB               |
H|# Охлаждение хотэнда левой головы   | FAN1              |
H|# Охлаждение хотэнда правой головы  | FAN2              |
# Охлаждение модели                 | FAN0              |
# Охлаждение отсека электроники     | FAN3              |
# Концевик оси Y левый              | MIN1              |
# Концевик оси Y правый             | MIN2              |
H|# Концевик оси X                    | MIN3              |
H|# Концевик оси W                    | MIN4              |
H|# Датчик автоуровня                 | IND-Probe (PF11)  |
# Подсветка отсека печати           | HE2               |

@@BASE@@
[carriage ylc]
endstop_pin: ^PF0

[extra_carriage yrc]
endstop_pin: ^PF2

[heater_bed]
heater_pin: PF5
sensor_pin: PB1

[fan]
pin: !PA6

[controller_fan electronics_fan]
pin: PA3

[led print_chamber_led]
white_pin: PF9
initial_WHITE: 1.0

@@MOTORS@@
[stepper motor_x]
step_pin: PC13
dir_pin: PC14
enable_pin: !PE6

[socket motor_x]
pin: PG14

[stepper motor_w]
step_pin: PE4
dir_pin: PE5
enable_pin: !PE3

[socket motor_w]
pin: PG13

[stepper motor_yl]
step_pin: PE1
dir_pin: PE0
enable_pin: !PE2

[socket motor_yl]
pin: PG12

[stepper motor_yr]
step_pin: PB8
dir_pin: PB9
enable_pin: !PB7

[socket motor_yr]
pin: PG11

[stepper motor_z]
step_pin: PB5
dir_pin: PB4
enable_pin: !PB6

[socket motor_z]
pin: PG10

[spi]
spi_software_sclk_pin: PE12
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13

@@EXTRUDERS@@
[extruder]
step_pin: PG15
dir_pin: PB3
enable_pin: !PD5

[socket extruder]
pin: PG9

[extruder1]
step_pin: PD3
dir_pin: PD2
enable_pin: !PD4

[socket extruder1]
pin: PD7

@@HEADS@@
[extruder]
heater_pin: PF6
sensor_pin: PB0

[extruder1]
heater_pin: PA0
sensor_pin: PC5

[heater_fan e0_fan]
pin: PA5

[heater_fan e1_fan]
pin: PA4

[carriage xc]
endstop_pin: ^PF4

[dual_carriage wc]
endstop_pin: ^PF3

[probe]
pin: ^!PF11
