# Пресет пинов VOSTOK: BTT Octopus Pro v1.0 (F446 / F429).
# Источник: klipper/config/generic-bigtreetech-octopus-pro-v1.0.cfg и user_configs/electronics_octopus_pro_v1.0_f446_4x5160_3x2209.cfg
# (моторы, драйверы, знаки dir_pin, вентиляторы и зонд взяты из него). Плата не проверена на железе.
# Отличие от v1.1 (сверено diff конфигов Klipper): HE0 = PA2, HE2 = PB10, enable MOTOR3 = PA0; пресет v1.1 (octopus_pro) сюда не подходит.
# Роли по порядку разъёмов: MOTOR0..4 = X, W, Y левый, Y правый, Z; MOTOR5/MOTOR6 = экструдеры T0/T1 (без плат голов).
# Концевики как в стоке VOSTOK: Y левый/правый = STOP0/STOP1, X/W (без голов) = STOP2/STOP3.
@@TABLE@@
# Мотор оси X                       | MOTOR0            |
# Мотор оси W                       | MOTOR1            |
# Левый мотор оси Y                 | MOTOR2            |
# Правый мотор оси Y                | MOTOR3            |
# Мотор оси Z                       | MOTOR4            |
H|# Мотор фидера левой головы         | MOTOR5            |
H|# Мотор фидера правой головы        | MOTOR6            |
H|# Нагреватель левой головы          | HE0               |
H|# Нагреватель правой головы         | HE1               |
# Нагреватель стола                 | HB (BED)          |
H|# Термистор левой головы            | T0                |
H|# Термистор правой головы           | T1                |
# Термистор стола                   | TB                |
H|# Охлаждение хотэнда левой головы   | FAN0              |
H|# Охлаждение хотэнда правой головы  | FAN1              |
# Охлаждение модели                 | FAN2              |
# Охлаждение отсека электроники     | FAN3              |
# Концевик оси Y левый              | STOP0             |
# Концевик оси Y правый             | STOP1             |
H|# Концевик оси X                    | STOP2             |
H|# Концевик оси W                    | STOP3             |
H|# Датчик автоуровня                 | BLTouch           |
# Подсветка отсека печати           | HE3               |

@@BASE@@
[carriage ylc]
endstop_pin: ^PG6

[extra_carriage yrc]
endstop_pin: ^PG9

[heater_bed]
heater_pin: PA1
sensor_pin: PF3

[fan]
pin: !PD12

[controller_fan electronics_fan]
pin: PD13

[led print_chamber_led]
white_pin: PB11
initial_WHITE: 1.0

@@MOTORS@@
[stepper motor_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14

[socket motor_x]
pin: PC4

[stepper motor_w]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15

[socket motor_w]
pin: PD11

[stepper motor_yl]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5

[socket motor_yl]
pin: PC6

[stepper motor_yr]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA0

[socket motor_yr]
pin: PC7

[stepper motor_z]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2

[socket motor_z]
pin: PF2

[spi]
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6

@@EXTRUDERS@@
[extruder]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1

[socket extruder]
pin: PE4

[extruder1]
step_pin: PE2
dir_pin: !PE3
enable_pin: !PD4

[socket extruder1]
pin: PE1

@@HEADS@@
[extruder]
heater_pin: PA2
sensor_pin: PF4

[extruder1]
heater_pin: PA3
sensor_pin: PF5

[heater_fan e0_fan]
pin: PA8

[heater_fan e1_fan]
pin: PE5

[carriage xc]
endstop_pin: ^PG10

[dual_carriage wc]
endstop_pin: ^PG11

[probe]
pin: ^!PB7

[output_pin probe_enable]
pin: PB6
