# Пресет пинов VOSTOK: BTT Manta M8P v1.0.
# Источник: klipper/config/generic-bigtreetech-manta-m8p-v1.0.cfg.
# Плата не проверена на железе. Роли распределены по порядку разъёмов (решение пользователя):
# MOTOR1..5 = X, W, Y левый, Y правый, Z; MOTOR6/MOTOR7 = экструдеры T0/T1 (без плат голов).
# Нумерация концевиков (STOP 1..4) - по порядку в примере BTT. Драйверы по SPI: программный SPI на PA5/PA7/PA6 (аппаратный spi1 платы).
# Знаки dir_pin не проверены: проверьте направление моторов после первого запуска.
@@TABLE@@
# Мотор оси X                       | MOTOR1            |
# Мотор оси W                       | MOTOR2            |
# Левый мотор оси Y                 | MOTOR3            |
# Правый мотор оси Y                | MOTOR4            |
# Мотор оси Z                       | MOTOR5            |
H|# Мотор фидера левой головы         | MOTOR6            |
H|# Мотор фидера правой головы        | MOTOR7            |
H|# Нагреватель левой головы          | HE0               |
H|# Нагреватель правой головы         | HE1               |
# Нагреватель стола                 | HB (BED)          |
H|# Термистор левой головы            | T0                |
H|# Термистор правой головы           | T1                |
# Термистор стола                   | TB                |
H|# Охлаждение хотэнда левой головы   | FAN0              |
H|# Охлаждение хотэнда правой головы  | FAN1              |
# Охлаждение модели                 | FAN2              |
# Охлаждение отсека электроники     | FAN3              |
# Концевик оси Y левый              | STOP 1            |
# Концевик оси Y правый             | STOP 2            |
H|# Концевик оси X                    | STOP 3            |
H|# Концевик оси W                    | STOP 4            |
H|# Датчик автоуровня                 | BLTouch           |
# Подсветка отсека печати           | HE2               |

@@BASE@@
[carriage ylc]
endstop_pin: ^PF3

[extra_carriage yrc]
endstop_pin: ^PF4

[heater_bed]
heater_pin: PB7
sensor_pin: PA0

[fan]
pin: !PC12

[controller_fan electronics_fan]
pin: PE5

[led print_chamber_led]
white_pin: PB6
initial_WHITE: 1.0

@@MOTORS@@
[stepper motor_x]
step_pin: PE2
dir_pin: PB4
enable_pin: !PC11

[socket motor_x]
pin: PC10

[stepper motor_w]
step_pin: PF12
dir_pin: PF11
enable_pin: !PB3

[socket motor_w]
pin: PF13

[stepper motor_yl]
step_pin: PD7
dir_pin: PD6
enable_pin: !PF10

[socket motor_yl]
pin: PF9

[stepper motor_yr]
step_pin: PD3
dir_pin: PD2
enable_pin: !PD5

[socket motor_yr]
pin: PD4

[stepper motor_z]
step_pin: PC9
dir_pin: PC8
enable_pin: !PD1

[socket motor_z]
pin: PD0

[spi]
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6

@@EXTRUDERS@@
[extruder]
step_pin: PA10
dir_pin: PD15
enable_pin: !PA15

[socket extruder]
pin: PF8

[extruder1]
step_pin: PD12
dir_pin: PD11
enable_pin: !PD14

[socket extruder1]
pin: PD13

@@HEADS@@
[extruder]
heater_pin: PE3
sensor_pin: PA1

[extruder1]
heater_pin: PB5
sensor_pin: PA2

[heater_fan e0_fan]
pin: PE6

[heater_fan e1_fan]
pin: PE0

[carriage xc]
endstop_pin: ^PF5

[dual_carriage wc]
endstop_pin: ^PC0

[probe]
pin: ^!PB2

[output_pin probe_enable]
pin: PB1
