# Пресет пинов VOSTOK: BTT Kraken v1.0/v1.1 (STM32H723, 8 встроенных TMC2160).
# Источник: BIGTREETECH-Kraken/Firmware/generic-bigtreetech-kraken.cfg (репозиторий BTT; локальной копии в klipper/config нет).
# Плата не проверена на железе. Роли распределены по порядку слотов (решение пользователя):
# S1..S5 = X, W, Y левый, Y правый, Z; S6/S7 = экструдеры T0/T1 (без плат голов); S8 свободен.
# Концевики в cfg BTT есть только у S1..S4 (PC15, PF0, PF1, PF2): Y левый/правый = S1/S2, X/W (без голов) = S3/S4.
# Драйверы встроены (SPI, программный на PC6/PC8/PC7), тип драйвера для платы - только TMC2160.
# sense_resistor: S1..S4 у v1.1 - 0.05 (у v1.0 - 0.022), S5..S8 - 0.075; поставлено значение v1.1, на v1.0 исправьте.
# Знаки dir_pin как в cfg BTT: проверьте направление моторов после первого запуска.
@@TABLE@@
# Мотор оси X                       | S1                |
# Мотор оси W                       | S2                |
# Левый мотор оси Y                 | S3                |
# Правый мотор оси Y                | S4                |
# Мотор оси Z                       | S5                |
H|# Мотор фидера левой головы         | S6                |
H|# Мотор фидера правой головы        | S7                |
H|# Нагреватель левой головы          | HE0               |
H|# Нагреватель правой головы         | HE1               |
# Нагреватель стола                 | HB                |
H|# Термистор левой головы            | T0                |
H|# Термистор правой головы           | T1                |
# Термистор стола                   | TB                |
H|# Охлаждение хотэнда левой головы   | FAN1              |
H|# Охлаждение хотэнда правой головы  | FAN2              |
# Охлаждение модели                 | FAN0              |
# Охлаждение отсека электроники     | FAN3              |
# Концевик оси Y левый              | S1 (PC15)         |
# Концевик оси Y правый             | S2 (PF0)          |
H|# Концевик оси X                    | S3 (PF1)          |
H|# Концевик оси W                    | S4 (PF2)          |
H|# Датчик автоуровня                 | PD11 (PROBE)      |
# Подсветка отсека печати           | HE2               |

@@BASE@@
[carriage ylc]
endstop_pin: ^PC15

[extra_carriage yrc]
endstop_pin: ^PF0

[heater_bed]
heater_pin: PF5
sensor_pin: PB0

[fan]
pin: !PA0

[controller_fan electronics_fan]
pin: PA3

[led print_chamber_led]
white_pin: PF9
initial_WHITE: 1.0

@@MOTORS@@
[stepper motor_x]
step_pin: PC14
dir_pin: PC13
enable_pin: !PE6

[socket motor_x]
pin: PD6

[stepper motor_w]
step_pin: PE5
dir_pin: PE4
enable_pin: !PE3

[socket motor_w]
pin: PD5

[stepper motor_yl]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE0

[socket motor_yl]
pin: PD4

[stepper motor_yr]
step_pin: PB9
dir_pin: PB8
enable_pin: !PB7

[socket motor_yr]
pin: PD3

[stepper motor_z]
step_pin: PG9
dir_pin: PG10
enable_pin: !PG13

[socket motor_z]
pin: PD2

[spi]
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7

@@EXTRUDERS@@
[extruder]
step_pin: PG11
dir_pin: PD7
enable_pin: !PG12

[socket extruder]
pin: PA15

[extruder1]
step_pin: PB4
dir_pin: PB3
enable_pin: !PB5

[socket extruder1]
pin: PA9

@@HEADS@@
[extruder]
heater_pin: PF6
sensor_pin: PB1

[extruder1]
heater_pin: PF7
sensor_pin: PC5

[heater_fan e0_fan]
pin: PA1

[heater_fan e1_fan]
pin: PA2

[carriage xc]
endstop_pin: ^PF1

[dual_carriage wc]
endstop_pin: ^PF2

[probe]
pin: ^!PD11

[output_pin probe_enable]
pin: PD10

@@SENSE@@
x: 0.05
w: 0.05
yl: 0.05
yr: 0.05
