# BTT EBB36 Gen2 (STM32G0B1)
# Источник: EBB_GEN2/EBB36_GEN2/sample-bigtreetech-ebb36-gen2-v1.0.cfg (репозиторий BTT): экструдер, нагреватель, термистор, UART, вентиляторы; концевик (PA15) и BLTouch (PB8/PB5) заданы там закомментированными строками. Знак dir_pin T1 принят зеркальным.
# СВЕРЬТЕ: платы голов EBB36 Gen2 - пины концевика (PA15) и зонда (PB8 вход, PB5 питание) взяты из закомментированных строк sample-конфига BTT, знак dir_pin T1 принят зеркальным; проверьте их на своей плате
@@T0@@
[extruder]
step_pin: {M}:PB14
dir_pin: {M}:PA8
enable_pin: !{M}:PB6
heater_pin: {M}:PB4
sensor_pin: {M}:PA3

[tmc2209 extruder]
uart_pin: {M}:PB3

[carriage xc]
endstop_pin: ^{M}:PA15

[probe]
pin: ^!{M}:PB8

[output_pin probe_enable]
pin: {M}:PB5

[heater_fan e0_fan]
pin: {M}:PA5

[controller_fan {M}_fan]
pin: {M}:PD3

[temperature_sensor {M}]
sensor_type: temperature_mcu
sensor_mcu: {M}
@@T1@@
[extruder1]
step_pin: {M}:PB14
dir_pin: !{M}:PA8
enable_pin: !{M}:PB6
heater_pin: {M}:PB4
sensor_pin: {M}:PA3

[tmc2209 extruder1]
uart_pin: {M}:PB3

[dual_carriage wc]
endstop_pin: ^{M}:PA15

[heater_fan e1_fan]
pin: {M}:PA5

[controller_fan {M}_fan]
pin: {M}:PD3

[temperature_sensor {M}]
sensor_type: temperature_mcu
sensor_mcu: {M}
