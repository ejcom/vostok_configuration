# Пресет пинов VOSTOK: Mellow FLY Super8 (STM32F407, 8 слотов драйверов Drive0..Drive7).
# Источник: Mellow-3D/klipper-docs (docs/board/fly_super8/cfg.md): Drive0..Drive5, нагреватель и термистор экструдера, стол, вентиляторы;
# лист pinout из pinouts/Mellow/FLY-Super8 (на листе подписаны STEP/DIR/EN/UART/DIAG всех слотов): Drive6/Drive7, HEAT1, ADC_1, BLTouch.
# Плата не проверена на железе. Роли по порядку слотов: Drive0..4 = X, W, Y левый, Y правый, Z; Drive5/Drive6 = экструдеры T0/T1
# (без плат голов); Drive7 свободен.
# CS (SPI) и UART драйвера - один и тот же пин слота. Пины SPI для драйверов 5160/2130 ни в cfg, ни на листе не указаны: при SPI-драйверах
# sclk/mosi/miso остаются ЗАПОЛНИТЕ (для UART-драйверов TMC2208/2209 ничего вписывать не нужно).
# Концевики: Y левый/правый = IO0/IO1 (DIAG0/DIAG1: PG12/PG11), X/W (без голов) = IO2/IO3 (PG10/PG9); полярность (!) как в cfg Mellow.
# Пины, прочитанные только с листа (не из cfg): слоты Drive6/Drive7, нагреватель HEAT1 (PB1), термистор ADC_1 (PF5), BLTouch (PC3 вход, PC6 сервопривод):
# сверьте их со своей платой. Знаки dir_pin - как в cfg Mellow (для Drive0..5), у Drive6 знака в источнике нет.
@@TABLE@@
# Мотор оси X                       | Drive0            |
# Мотор оси W                       | Drive1            |
# Левый мотор оси Y                 | Drive2            |
# Правый мотор оси Y                | Drive3            |
# Мотор оси Z                       | Drive4            |
H|# Мотор фидера левой головы         | Drive5            |
H|# Мотор фидера правой головы        | Drive6            |
H|# Нагреватель левой головы          | HEAT0 (PB0)       |
H|# Нагреватель правой головы         | HEAT1 (PB1)       |
# Нагреватель стола                 | Bed output (PE5)  |
H|# Термистор левой головы            | ADC_0 (PF4)       |
H|# Термистор правой головы           | ADC_1 (PF5)       |
# Термистор стола                   | ADC5 (PC1)        |
H|# Охлаждение хотэнда левой головы   | FAN1              |
H|# Охлаждение хотэнда правой головы  | FAN2              |
# Охлаждение модели                 | FAN0              |
# Охлаждение отсека электроники     | FAN3              |
# Концевик оси Y левый              | IO0 (PG12)        |
# Концевик оси Y правый             | IO1 (PG11)        |
H|# Концевик оси X                    | IO2 (PG10)        |
H|# Концевик оси W                    | IO3 (PG9)         |
H|# Датчик автоуровня                 | BLTouch (PC3)     |
# Подсветка отсека печати           | FAN4              |

@@BASE@@
[carriage ylc]
endstop_pin: !PG12

[extra_carriage yrc]
endstop_pin: !PG11

[heater_bed]
heater_pin: PE5
sensor_pin: PC1

[fan]
pin: PA0

[controller_fan electronics_fan]
pin: PA3

[led print_chamber_led]
white_pin: PA15
initial_WHITE: 1.0

@@MOTORS@@
[stepper motor_x]
step_pin: PE2
dir_pin: PC5
enable_pin: !PF11

[socket motor_x]
pin: PC4

[stepper motor_w]
step_pin: PE3
dir_pin: PF13
enable_pin: !PF14

[socket motor_w]
pin: PF12

[stepper motor_yl]
step_pin: PE4
dir_pin: !PG0
enable_pin: !PG1

[socket motor_yl]
pin: PF15

[stepper motor_yr]
step_pin: PE14
dir_pin: !PE8
enable_pin: !PE9

[socket motor_yr]
pin: PE7

[stepper motor_z]
step_pin: PE15
dir_pin: !PE11
enable_pin: !PF2

[socket motor_z]
pin: PE10

@@EXTRUDERS@@
[extruder]
step_pin: PE1
dir_pin: !PF0
enable_pin: !PC15

[socket extruder]
pin: PF1

[extruder1]
step_pin: PE0
dir_pin: PG3
enable_pin: !PG4

[socket extruder1]
pin: PG2

@@HEADS@@
[extruder]
heater_pin: PB0
sensor_pin: PF4

[extruder1]
heater_pin: PB1
sensor_pin: PF5

[heater_fan e0_fan]
pin: PA1

[heater_fan e1_fan]
pin: PA2

[carriage xc]
endstop_pin: !PG10

[dual_carriage wc]
endstop_pin: !PG9

[probe]
pin: ^!PC3

[output_pin probe_enable]
pin: PC6
