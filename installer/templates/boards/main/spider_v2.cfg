# Пресет пинов VOSTOK: Fysetc Spider v2.2 / v2.3 (STM32F446).
# Источник: FYSETC-SPIDER/firmware/Klipper/printer.cfg (моторы, UART, нагреватели, концевики, зонд) и листы pinout v2.2/v2.3
# из pinouts/Fysetc/Spider (экструдер E1, терморезисторы, вентиляторы, разъёмы). У v2.2 и v2.3 пины одинаковы.
# Плата не проверена на железе. Роли по порядку разъёмов (решение пользователя):
# M1..M5 = X, W, Y левый, Y правый, Z; M6/M7 (E2/E3) = экструдеры T0/T1 (без плат голов); M4/M5 (E0/E1) заняты осями.
# Пины CS/PDN у драйвера общие для UART и SPI (SPI программный на PE12/PE14/PE13: sclk/mosi/miso).
# Вентиляторов три (FAN0..FAN2): электроника - на выходе E2 OUT (PB3, 24 В, как в cfg Fysetc), подсветка - на RGB-разъёме (PD3, данные 5 В).
# Концевики: X_MIN PB14, Y_MIN PB13, Z_MIN PA0, X_MAX PA1, Y_MAX PA2, Z_MAX PA3 (PA3 - вход зонда V-PROBE).
# Знаки dir_pin как в cfg Fysetc (там заданы для X, Y, Z, E0, Z1..Z3): проверьте направление моторов после первого запуска.
@@TABLE@@
# Мотор оси X                       | M1 (X-MOT)        |
# Мотор оси W                       | M2 (Y-MOT)        |
# Левый мотор оси Y                 | M3 (Z-MOT)        |
# Правый мотор оси Y                | M4 (E0-MOT)       |
# Мотор оси Z                       | M5 (E1-MOT)       |
H|# Мотор фидера левой головы         | M6 (E2-MOT)       |
H|# Мотор фидера правой головы        | M7 (E3-MOT)       |
H|# Нагреватель левой головы          | E0 OUT            |
H|# Нагреватель правой головы         | E1 OUT            |
# Нагреватель стола                 | BED OUT           |
H|# Термистор левой головы            | TE0               |
H|# Термистор правой головы           | TE1               |
# Термистор стола                   | TB                |
H|# Охлаждение хотэнда левой головы   | FAN0              |
H|# Охлаждение хотэнда правой головы  | FAN2              |
# Охлаждение модели                 | FAN1              |
# Охлаждение отсека электроники     | E2 OUT            |
# Концевик оси Y левый              | X_MIN             |
# Концевик оси Y правый             | Y_MIN             |
H|# Концевик оси X                    | Z_MIN             |
H|# Концевик оси W                    | X_MAX             |
H|# Датчик автоуровня                 | Z_MAX (V-PROBE)   |
# Подсветка отсека печати           | RGB (PD3)         |

@@BASE@@
[carriage ylc]
endstop_pin: ^PB14

[extra_carriage yrc]
endstop_pin: ^PB13

[heater_bed]
heater_pin: PB4
sensor_pin: PB0

[fan]
pin: PA14

[controller_fan electronics_fan]
pin: PB3

[led print_chamber_led]
white_pin: PD3
initial_WHITE: 1.0

@@MOTORS@@
[stepper motor_x]
step_pin: PE11
dir_pin: !PE10
enable_pin: !PE9

[socket motor_x]
pin: PE7

[stepper motor_w]
step_pin: PD8
dir_pin: !PB12
enable_pin: !PD9

[socket motor_w]
pin: PE15

[stepper motor_yl]
step_pin: PD14
dir_pin: !PD13
enable_pin: !PD15

[socket motor_yl]
pin: PD10

[stepper motor_yr]
step_pin: PD5
dir_pin: !PD6
enable_pin: !PD4

[socket motor_yr]
pin: PD7

[stepper motor_z]
step_pin: PE6
dir_pin: PC13
enable_pin: !PE5

[socket motor_z]
pin: PC14

[spi]
spi_software_sclk_pin: PE12
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13

@@EXTRUDERS@@
[extruder]
step_pin: PE2
dir_pin: !PE4
enable_pin: !PE3

[socket extruder]
pin: PC15

[extruder1]
step_pin: PD12
dir_pin: PC4
enable_pin: !PE8

[socket extruder1]
pin: PA15

@@HEADS@@
[extruder]
heater_pin: PB15
sensor_pin: PC0

[extruder1]
heater_pin: PC8
sensor_pin: PC1

[heater_fan e0_fan]
pin: PA13

[heater_fan e1_fan]
pin: PB2

[carriage xc]
endstop_pin: ^PA0

[dual_carriage wc]
endstop_pin: ^PA1

[probe]
pin: ^!PA3
