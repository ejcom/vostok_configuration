# Головы подключены прямо к Octopus Pro (без плат голов): разъёмы самой платы.
# В main эти пины стоят на платах голов (T0CB:PA8 и т.п.), поэтому здесь значения из конфигов репозитория
# для Octopus Pro (user_configs/electronics_octopus_pro_v1.0_f446_4x5160_3x2209.cfg), где головы на Octopus:
#   HE0/HE1 = PA2/PA3, T0/T1 = PF4/PF5, FAN0/FAN1 = PA8/PE5, зонд BLTouch = PB7/PB6,
#   концевики X/W = STOP2/STOP3 (PG10/PG11): STOP0/STOP1 в стоке заняты концевиками Y.
# Таблицу не сверяли с документацией Octopus Pro v1.1 H723: пользователь сверяет её со своей проводкой.
[extruder]
heater_pin: PA2
sensor_pin: PF4

[extruder1]
heater_pin: PA3
sensor_pin: PF5

[heater_fan e0_fan]
pin: PA8

[heater_fan e1_fan]
pin: PE5

[carriage xc]
endstop_pin: ^PG10

[dual_carriage wc]
endstop_pin: ^PG11

[probe]
pin: ^!PB7

[output_pin probe_enable]
pin: PB6
