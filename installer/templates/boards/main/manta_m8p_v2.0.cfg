# Пресет пинов VOSTOK: BTT Manta M8P v2.0.
# Источник: Manta-M8P/V2.0/Firmware/generic-bigtreetech-manta-m8p-V2_0.cfg (репозиторий BTT; локальной копии в klipper/config нет).
# Плата не проверена на железе. Роли распределены по порядку разъёмов (решение пользователя):
# MOTOR1..5 = X, W, Y левый, Y правый, Z; MOTOR6/MOTOR7 = экструдеры T0/T1 (без плат голов).
# Нумерация концевиков (STOP 1..4) - по порядку в примере BTT. SPI драйверов - программный на PG8/PG6/PG7.
# Знаки dir_pin не проверены: проверьте направление моторов после первого запуска.
@@TABLE@@
# Мотор оси X                       | MOTOR1            |
# Мотор оси W                       | MOTOR2            |
# Левый мотор оси Y                 | MOTOR3            |
# Правый мотор оси Y                | MOTOR4            |
# Мотор оси Z                       | MOTOR5            |
H|# Мотор фидера левой головы         | MOTOR6            |
H|# Мотор фидера правой головы        | MOTOR7            |
H|# Нагреватель левой головы          | HE0               |
H|# Нагреватель правой головы         | HE1               |
# Нагреватель стола                 | HB (BED)          |
H|# Термистор левой головы            | T0                |
H|# Термистор правой головы           | T1                |
# Термистор стола                   | TB                |
H|# Охлаждение хотэнда левой головы   | FAN0              |
H|# Охлаждение хотэнда правой головы  | FAN1              |
# Охлаждение модели                 | FAN2              |
# Охлаждение отсека электроники     | FAN3              |
# Концевик оси Y левый              | STOP 1            |
# Концевик оси Y правый             | STOP 2            |
H|# Концевик оси X                    | STOP 3            |
H|# Концевик оси W                    | STOP 4            |
H|# Датчик автоуровня                 | BLTouch           |
# Подсветка отсека печати           | HE2               |

@@BASE@@
[carriage ylc]
endstop_pin: ^PF4

[extra_carriage yrc]
endstop_pin: ^PF3

[heater_bed]
heater_pin: PF5
sensor_pin: PB1

[fan]
pin: !PF6

[controller_fan electronics_fan]
pin: PF8

[led print_chamber_led]
white_pin: PA3
initial_WHITE: 1.0

@@MOTORS@@
[stepper motor_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14

[socket motor_x]
pin: PC13

[stepper motor_w]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4

[socket motor_w]
pin: PE3

[stepper motor_yl]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PE0

[socket motor_yl]
pin: PB9

[stepper motor_yr]
step_pin: PB4
dir_pin: PB3
enable_pin: !PB6

[socket motor_yr]
pin: PB5

[stepper motor_z]
step_pin: PG13
dir_pin: PG12
enable_pin: !PG15

[socket motor_z]
pin: PG14

[spi]
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7

@@EXTRUDERS@@
[extruder]
step_pin: PG9
dir_pin: PD7
enable_pin: !PG11

[socket extruder]
pin: PG10

[extruder1]
step_pin: PD4
dir_pin: PD3
enable_pin: !PD6

[socket extruder1]
pin: PD5

@@HEADS@@
[extruder]
heater_pin: PA0
sensor_pin: PB0

[extruder1]
heater_pin: PA1
sensor_pin: PC5

[heater_fan e0_fan]
pin: PF7

[heater_fan e1_fan]
pin: PF9

[carriage xc]
endstop_pin: ^PF2

[dual_carriage wc]
endstop_pin: ^PF1

[probe]
pin: ^!PD13

[output_pin probe_enable]
pin: PD12
