# Экструдеры, подключённые прямо к Octopus Pro (без плат голов): свободные разъёмы стока VOSTOK.
# Нужны, только когда в эталонном конфиге пользователя нет пинов экструдеров на основной плате.
# E0 (левая голова) - MOTOR4, E1 (правая голова) - MOTOR5. Пины сверены с конфигами в user_configs/.
# [socket ...] - пин драйверного разъёма: cs_pin для SPI-драйверов, uart_pin для UART (на Octopus это один пин).
# Знак dir_pin проверьте после первого запуска: направление зависит от подключения мотора.
[extruder]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2

[socket extruder]
pin: PF2

[extruder1]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1

[socket extruder1]
pin: PE4
