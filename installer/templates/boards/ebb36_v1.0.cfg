# BTT EBB36 / EBB42 CAN v1.0 (STM32F072; пины у EBB36 и EBB42 v1.0 одинаковы).
# Источник: klipper/config/sample-bigtreetech-ebb-canbus-v1.0.cfg (экструдер, нагреватель, термистор, вентиляторы, UART) и
# листы pinout из pinouts/BTT/EBB/ebb36_v1_0 и ebb42_v1_0 (разъёмы концевика PC13..PC15 и зонда PA4/PA5).
# СВЕРЬТЕ: платы голов EBB v1.0 - пины концевика (PC13) и зонда (PA4/PA5) прочитаны с листа pinout, знак dir_pin T1 принят зеркальным; проверьте их на своей плате, включая питание зонда
@@T0@@
[extruder]
step_pin: {M}:PA9
dir_pin: !{M}:PA8
enable_pin: !{M}:PA10
heater_pin: {M}:PB1
sensor_pin: {M}:PA0

[tmc2209 extruder]
uart_pin: {M}:PA13

[carriage xc]
endstop_pin: ^{M}:PC13

[probe]
pin: ^!{M}:PA4

[output_pin probe_enable]
pin: {M}:PA5

[heater_fan e0_fan]
pin: {M}:PA1

[controller_fan {M}_fan]
pin: {M}:PA2

[temperature_sensor {M}]
sensor_type: temperature_mcu
sensor_mcu: {M}
@@T1@@
[extruder1]
step_pin: {M}:PA9
dir_pin: {M}:PA8
enable_pin: !{M}:PA10
heater_pin: {M}:PB1
sensor_pin: {M}:PA0

[tmc2209 extruder1]
uart_pin: {M}:PA13

[dual_carriage wc]
endstop_pin: ^{M}:PC13

[heater_fan e1_fan]
pin: {M}:PA1

[controller_fan {M}_fan]
pin: {M}:PA2

[temperature_sensor {M}]
sensor_type: temperature_mcu
sensor_mcu: {M}
