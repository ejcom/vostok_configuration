# FLY SHT36 V2 (F072 / APM32F072)
# Источник: mellow.klipper.cn, SHT36 V2: страницы «Pinout» и «Config» (экструдер PB4/PB3/PA15, UART PB5, нагреватель PA8, термистор PA3, FAN0 PB11, FAN1 PB10, концевик PA2, BLTouch PC15/PB1). Знак dir_pin T1 принят зеркальным.
# СВЕРЬТЕ: платы голов SHT36 V2 - пины концевика (PA2) и зонда (PC15 вход, PB1 питание) и полярность взяты из cfg Mellow (там они закомментированы), знак dir_pin T1 принят зеркальным, SHT42 отдельно не проверялся; проверьте их на своей плате
@@T0@@
[extruder]
step_pin: {M}:PB4
dir_pin: {M}:PB3
enable_pin: !{M}:PA15
heater_pin: {M}:PA8
sensor_pin: {M}:PA3

[tmc2209 extruder]
uart_pin: {M}:PB5

[carriage xc]
endstop_pin: !{M}:PA2

[probe]
pin: ^{M}:PC15

[output_pin probe_enable]
pin: {M}:PB1

[heater_fan e0_fan]
pin: {M}:PB10

[controller_fan {M}_fan]
pin: {M}:PB11

[temperature_sensor {M}]
sensor_type: temperature_mcu
sensor_mcu: {M}
@@T1@@
[extruder1]
step_pin: {M}:PB4
dir_pin: !{M}:PB3
enable_pin: !{M}:PA15
heater_pin: {M}:PA8
sensor_pin: {M}:PA3

[tmc2209 extruder1]
uart_pin: {M}:PB5

[dual_carriage wc]
endstop_pin: !{M}:PA2

[heater_fan e1_fan]
pin: {M}:PB10

[controller_fan {M}_fan]
pin: {M}:PB11

[temperature_sensor {M}]
sensor_type: temperature_mcu
sensor_mcu: {M}
