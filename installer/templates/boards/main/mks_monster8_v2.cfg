# Пресет пинов VOSTOK: MKS Monster8 V2 (STM32F407, 8 слотов драйверов).
# Источник: klipper/config/generic-mks-monster8.cfg (моторы, CS/UART, нагреватели, вентиляторы, концевики) и
# MKS-Monster8/klipper firmware/Voron 2.4 config/printer_v2.cfg (spi_bus: spi4, пин зонда); листа pinout V2 в виде текста нет (растровый PDF).
# Плата не проверена на железе. Роли по порядку слотов (решение пользователя): слоты X, Y, Z, E0, E1 = X, W, Y левый, Y правый, Z;
# слоты E2/E3 = экструдеры T0/T1 (без плат голов); слот E4 свободен.
# CS (SPI) и UART драйвера - один и тот же пин слота. SPI драйверов - программный на пинах spi4 (PE12/PE14/PE13, из `spi_bus: spi4` в cfg MKS).
# У слотов X и Y в cfg MKS общий enable-пин PC15 (Klipper допускает общий enable), проверьте это по схеме.
# Знаки dir_pin и полярность концевиков (без ^ и !) - как в generic-mks-monster8.cfg: проверьте направление моторов и срабатывание после первого запуска.
# Вентиляторов три (FAN0..FAN2): электроника - на выходе HE2 (PA3, 24 В), подсветка - на RGB-разъёме (PA9, данные 5 В), как в cfg MKS.
# Концевики: Y левый/правый = X-min/Y-min (PA14/PA15), X/W (без голов) = Z-min/X-max (PB13/PA13); Z-max (PB12) - вход зонда.
# Питания зонда ([output_pin probe_enable]) в cfg нет: пин остаётся ЗАПОЛНИТЕ.
@@TABLE@@
# Мотор оси X                       | X (слот)          |
# Мотор оси W                       | Y (слот)          |
# Левый мотор оси Y                 | Z (слот)          |
# Правый мотор оси Y                | E0 (слот)         |
# Мотор оси Z                       | E1 (слот)         |
H|# Мотор фидера левой головы         | E2 (слот)         |
H|# Мотор фидера правой головы        | E3 (слот)         |
H|# Нагреватель левой головы          | HE0               |
H|# Нагреватель правой головы         | HE1               |
# Нагреватель стола                 | HB                |
H|# Термистор левой головы            | TH0 (PC1)         |
H|# Термистор правой головы           | TH1 (PC2)         |
# Термистор стола                   | TB (PC0)          |
H|# Охлаждение хотэнда левой головы   | FAN1              |
H|# Охлаждение хотэнда правой головы  | FAN2              |
# Охлаждение модели                 | FAN0              |
# Охлаждение отсека электроники     | HE2               |
# Концевик оси Y левый              | X-min (PA14)      |
# Концевик оси Y правый             | Y-min (PA15)      |
H|# Концевик оси X                    | Z-min (PB13)      |
H|# Концевик оси W                    | X-max (PA13)      |
H|# Датчик автоуровня                 | Z-max (PB12)      |
# Подсветка отсека печати           | RGB (PA9)         |

@@BASE@@
[carriage ylc]
endstop_pin: PA14

[extra_carriage yrc]
endstop_pin: PA15

[heater_bed]
heater_pin: PB10
sensor_pin: PC0

[fan]
pin: PA2

[controller_fan electronics_fan]
pin: PA3

[led print_chamber_led]
white_pin: PA9
initial_WHITE: 1.0

@@MOTORS@@
[stepper motor_x]
step_pin: PC14
dir_pin: PC13
enable_pin: !PC15

[socket motor_x]
pin: PE6

[stepper motor_w]
step_pin: PE5
dir_pin: !PE4
enable_pin: !PC15

[socket motor_w]
pin: PE3

[stepper motor_yl]
step_pin: PE1
dir_pin: PE0
enable_pin: !PE2

[socket motor_yl]
pin: PB7

[stepper motor_yr]
step_pin: PB5
dir_pin: !PB4
enable_pin: !PB6

[socket motor_yr]
pin: PB3

[stepper motor_z]
step_pin: PD6
dir_pin: !PD5
enable_pin: !PD7

[socket motor_z]
pin: PD4

[spi]
spi_software_sclk_pin: PE12
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13

@@EXTRUDERS@@
[extruder]
step_pin: PD2
dir_pin: !PD1
enable_pin: !PD3

[socket extruder]
pin: PD0

[extruder1]
step_pin: PC7
dir_pin: PC6
enable_pin: !PC8

[socket extruder1]
pin: PD15

@@HEADS@@
[extruder]
heater_pin: PB1
sensor_pin: PC1

[extruder1]
heater_pin: PB0
sensor_pin: PC2

[heater_fan e0_fan]
pin: PA1

[heater_fan e1_fan]
pin: PA0

[carriage xc]
endstop_pin: PB13

[dual_carriage wc]
endstop_pin: PA13

[probe]
pin: !PB12
