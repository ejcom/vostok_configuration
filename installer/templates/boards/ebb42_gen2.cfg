# BTT EBB42 Gen2 (STM32G0B1)
# Источник: EBB_GEN2/EBB42_GEN2/sample-bigtreetech-ebb42-gen2-v1.0.cfg (репозиторий BTT): экструдер, нагреватель, термистор, UART, вентиляторы; концевик (PA2) и BLTouch (PA5/PA4) заданы там закомментированными строками. Знак dir_pin T1 принят зеркальным.
# СВЕРЬТЕ: платы голов EBB42 Gen2 - пины концевика (PA2) и зонда (PA5 вход, PA4 питание) взяты из закомментированных строк sample-конфига BTT, знак dir_pin T1 принят зеркальным; проверьте их на своей плате
@@T0@@
[extruder]
step_pin: {M}:PD3
dir_pin: {M}:PD2
enable_pin: !{M}:PB6
heater_pin: {M}:PB0
sensor_pin: {M}:PA1

[tmc2209 extruder]
uart_pin: {M}:PB3

[carriage xc]
endstop_pin: ^{M}:PA2

[probe]
pin: ^!{M}:PA5

[output_pin probe_enable]
pin: {M}:PA4

[heater_fan e0_fan]
pin: {M}:PB15

[controller_fan {M}_fan]
pin: {M}:PB8

[temperature_sensor {M}]
sensor_type: temperature_mcu
sensor_mcu: {M}
@@T1@@
[extruder1]
step_pin: {M}:PD3
dir_pin: !{M}:PD2
enable_pin: !{M}:PB6
heater_pin: {M}:PB0
sensor_pin: {M}:PA1

[tmc2209 extruder1]
uart_pin: {M}:PB3

[dual_carriage wc]
endstop_pin: ^{M}:PA2

[heater_fan e1_fan]
pin: {M}:PB15

[controller_fan {M}_fan]
pin: {M}:PB8

[temperature_sensor {M}]
sensor_type: temperature_mcu
sensor_mcu: {M}
